version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck    # непроверенные возвращаемые ошибки
    - govet       # стандартный vet: подозрительные конструкции
    - staticcheck # более глубокий статический анализ (баги, устаревший API)
    - unused      # неиспользуемый код
    - ineffassign # присваивания, значение которых нигде не читается
    - misspell    # опечатки в комментариях/строках
    - bodyclose   # незакрытые http.Response.Body

formatters:
  enable:
    - gofmt
    - goimports
